spring.application.name=user-service
server.port=${SERVER_PORT:8082}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.internal-api-key=${INTERNAL_API_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:file:../secrets/jwt-public.pem}
app.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080/internal}
app.auth-service.api-key=${AUTH_SERVICE_API_KEY:${INTERNAL_API_KEY:}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
spring.kafka.properties.ssl.keystore.location=${KAFKA_SSL_KEYSTORE_LOCATION:}
spring.kafka.properties.ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD:}
spring.kafka.properties.ssl.keystore.type=${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
spring.kafka.properties.ssl.key.password=${KAFKA_SSL_KEY_PASSWORD:}
app.kafka.topics.auth-events=${KAFKA_AUTH_EVENTS_TOPIC:auth.events}
app.kafka.topics.user-events=${KAFKA_USER_EVENTS_TOPIC:user.events}
app.kafka.topics.audit-events=${KAFKA_AUDIT_EVENTS_TOPIC:audit.events}
app.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:user-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
