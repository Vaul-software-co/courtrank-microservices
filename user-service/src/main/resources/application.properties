spring.application.name=user-service
server.port=${SERVER_PORT:8082}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.internal-api-key=${INTERNAL_API_KEY:}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.auth-events=${KAFKA_AUTH_EVENTS_TOPIC:auth.events}
app.kafka.topics.user-events=${KAFKA_USER_EVENTS_TOPIC:user.events}
app.kafka.topics.audit-events=${KAFKA_AUDIT_EVENTS_TOPIC:audit.events}
app.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:user-service}
