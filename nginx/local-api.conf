events {}

http {
  upstream auth_service {
    server auth-service:8080;
  }

  upstream user_service {
    server user-service:8082;
  }

  upstream social_service {
    server social-service:8084;
  }

  upstream audit_service {
    server audit-service:8086;
  }

  upstream legacy_backend {
    server host.docker.internal:4000;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-api-key, x-sub-token, x-club-id, x-internal-api-key, x-request-id" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /health {
      access_log off;
      return 200 "ok\n";
    }

    location /auth/ {
      proxy_pass http://auth_service;
    }

    location = /auth {
      proxy_pass http://auth_service;
    }

    location /users/ {
      proxy_pass http://user_service;
    }

    location = /users {
      proxy_pass http://user_service;
    }

    location /social/ {
      proxy_pass http://social_service;
    }

    location = /social {
      proxy_pass http://social_service;
    }

    location /audit/ {
      proxy_pass http://audit_service;
    }

    location = /audit {
      proxy_pass http://audit_service;
    }

    location /internal/users/ {
      proxy_pass http://user_service;
    }

    location /internal/social/ {
      proxy_pass http://social_service;
    }

    location /internal/audit/ {
      proxy_pass http://audit_service;
    }

    location /internal/auth/ {
      proxy_pass http://auth_service;
    }

    location @legacy_user_delete_me {
      proxy_pass http://auth_service;
    }

    location @legacy_user_delete_by_id {
      proxy_pass http://legacy_backend;
    }

    location = /user/me {
      error_page 418 = @legacy_user_delete_me;

      if ($request_method = DELETE) {
        return 418;
      }

      proxy_pass http://user_service;
    }

    location = /user/me/password {
      proxy_pass http://auth_service;
    }

    location = /user/me/data-consent {
      proxy_pass http://auth_service;
    }

    location = /user/me/notifications {
      proxy_pass http://legacy_backend;
    }

    location = /user/me/accept-terms {
      proxy_pass http://legacy_backend;
    }

    location = /user/search {
      proxy_pass http://social_service;
    }

    location ~ ^/user/me/(blocked|follow-requests)(/.*)?$ {
      proxy_pass http://social_service;
    }

    location ~ ^/user/me/followers/[^/]+$ {
      proxy_pass http://social_service;
    }

    location ~ ^/user/[^/]+/(block|follow|followers|following)$ {
      proxy_pass http://social_service;
    }

    location ~ ^/user/[^/]+/(ban|unban)$ {
      proxy_pass http://legacy_backend;
    }

    location ~ ^/user/[^/]+$ {
      error_page 419 = @legacy_user_delete_by_id;

      if ($request_method = DELETE) {
        return 419;
      }

      proxy_pass http://user_service;
    }

    location /user/ {
      proxy_pass http://user_service;
    }

    location = /user {
      proxy_pass http://user_service;
    }

    location / {
      proxy_pass http://legacy_backend;
    }
  }
}
