services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: courtrank-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtrank_auth
      POSTGRES_USER: courtrank_auth_user
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?AUTH_DATABASE_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtrank_auth_user -d courtrank_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: courtrank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: courtrank-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courtrank-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  auth-service:
    build:
      context: ./auth-service
    image: courtrank-auth:latest
    container_name: courtrank-auth
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://auth-postgres:5432/courtrank_auth
      DATABASE_USERNAME: courtrank_auth_user
      DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?AUTH_DATABASE_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WORKER_ACCESS_SERVICE_URL: ${WORKER_ACCESS_SERVICE_URL:-http://host.docker.internal:4000/internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    depends_on:
      auth-postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  auth_postgres_data:
