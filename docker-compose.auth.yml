services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: courtrank-auth-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/auth-postgres.env
    environment:
      POSTGRES_DB: courtrank_auth
      POSTGRES_USER: courtrank_auth_user
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtrank_auth_user -d courtrank_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-postgres:
    image: postgres:16-alpine
    container_name: courtrank-user-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/user-postgres.env
    environment:
      POSTGRES_DB: courtrank_users
      POSTGRES_USER: courtrank_user_user
    ports:
      - "5434:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtrank_user_user -d courtrank_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  social-postgres:
    image: postgres:16-alpine
    container_name: courtrank-social-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/social-postgres.env
    environment:
      POSTGRES_DB: courtrank_social
      POSTGRES_USER: courtrank_social_user
    ports:
      - "5435:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtrank_social_user -d courtrank_social"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: courtrank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: courtrank-kafka-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic auth.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic audit.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic user.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic social.events --partitions 1 --replication-factor 1;"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: courtrank-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courtrank-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    image: nginx:1.27-alpine
    container_name: courtrank-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/local-api.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      social-service:
        condition: service_healthy

  legacy-sync-service:
    build:
      context: ./legacy-sync-service
    image: courtrank-legacy-sync:latest
    container_name: courtrank-legacy-sync
    restart: unless-stopped
    env_file:
      - ./secrets/legacy-sync-service.env
    environment:
      KAFKA_BROKERS: kafka:29092
      AUTH_EVENTS_TOPIC: auth.events
      USER_EVENTS_TOPIC: user.events
      SOCIAL_DATABASE_URL: postgresql://courtrank_social_user:change-me@social-postgres:5432/courtrank_social?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-postgres:
        condition: service_healthy
      user-postgres:
        condition: service_healthy
      social-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./auth-service
    image: courtrank-auth:latest
    container_name: courtrank-auth
    restart: unless-stopped
    env_file:
      - ./secrets/auth-service.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,kafka}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://auth-postgres:5432/courtrank_auth
      DATABASE_USERNAME: courtrank_auth_user
      JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WORKER_ACCESS_SERVICE_URL: ${WORKER_ACCESS_SERVICE_URL:-http://host.docker.internal:4000/internal}
      USER_SERVICE_URL: http://user-service:8082/internal
    volumes:
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    depends_on:
      auth-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  user-service:
    build:
      context: ./user-service
    image: courtrank-user:latest
    container_name: courtrank-user
    restart: unless-stopped
    env_file:
      - ./secrets/user-service.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,kafka}
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://user-postgres:5432/courtrank_users
      DATABASE_USERNAME: courtrank_user_user
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      AUTH_SERVICE_URL: http://auth-service:8080/internal
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USER_EVENTS_TOPIC: user.events
      KAFKA_AUDIT_EVENTS_TOPIC: audit.events
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    ports:
      - "8082:8082"
    depends_on:
      user-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  social-service:
    build:
      context: ./social-service
    image: courtrank-social:latest
    container_name: courtrank-social
    restart: unless-stopped
    env_file:
      - ./secrets/social-service.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,kafka}
      SERVER_PORT: 8084
      DATABASE_URL: jdbc:postgresql://social-postgres:5432/courtrank_social
      DATABASE_USERNAME: courtrank_social_user
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      AUTH_SERVICE_URL: http://auth-service:8080/internal
      USER_SERVICE_URL: http://user-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USER_EVENTS_TOPIC: user.events
      KAFKA_SOCIAL_EVENTS_TOPIC: social.events
      KAFKA_AUDIT_EVENTS_TOPIC: audit.events
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    ports:
      - "8084:8084"
    depends_on:
      social-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

volumes:
  auth_postgres_data:
  user_postgres_data:
  social_postgres_data:
