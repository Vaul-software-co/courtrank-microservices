spring.application.name=auth-service
server.port=${SERVER_PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt.private-key=${JWT_PRIVATE_KEY:file:../secrets/jwt-private.pem}
app.jwt.public-key=${JWT_PUBLIC_KEY:file:../secrets/jwt-public.pem}
app.password.pepper=${PASSWORD_PEPPER}
app.api-keys.web=${WEB_API_KEY}
app.api-keys.mobile=${MOBILE_API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cookies.secure=${COOKIE_SECURE:false}
app.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.cookies.domain=${COOKIE_DOMAIN:}
app.cookies.access-max-age-seconds=${COOKIE_ACCESS_MAX_AGE_SECONDS:900}
app.cookies.refresh-max-age-seconds=${COOKIE_REFRESH_MAX_AGE_SECONDS:604800}
app.cookies.reset-max-age-seconds=${COOKIE_RESET_MAX_AGE_SECONDS:300}
app.worker-access.service-url=${WORKER_ACCESS_SERVICE_URL:http://localhost:4000/internal}
app.worker-access.api-key=${WORKER_ACCESS_SERVICE_API_KEY:}
app.user-service.url=${USER_SERVICE_URL:http://localhost:8082/internal}
app.user-service.api-key=${USER_SERVICE_API_KEY:${INTERNAL_API_KEY:}}
app.internal-api-key=${INTERNAL_API_KEY:}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:CourtRank <noreply@getcourtrank.com>}
app.maintenance.cleanup.enabled=${AUTH_CLEANUP_ENABLED:true}
app.maintenance.cleanup.cron=${AUTH_CLEANUP_CRON:0 0 3 * * *}
app.maintenance.cleanup.zone=${AUTH_CLEANUP_ZONE:America/Bogota}
app.maintenance.cleanup.session-retention=${AUTH_CLEANUP_SESSION_RETENTION:30d}
app.maintenance.cleanup.verification-token-retention=${AUTH_CLEANUP_VERIFICATION_TOKEN_RETENTION:7d}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
spring.kafka.properties.ssl.keystore.location=${KAFKA_SSL_KEYSTORE_LOCATION:}
spring.kafka.properties.ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD:}
spring.kafka.properties.ssl.keystore.type=${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
spring.kafka.properties.ssl.key.password=${KAFKA_SSL_KEY_PASSWORD:}
app.kafka.topics.auth-events=${KAFKA_AUTH_EVENTS_TOPIC:auth.events}
app.kafka.topics.audit-events=${KAFKA_AUDIT_EVENTS_TOPIC:audit.events}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.org.apache.kafka=WARN
logging.level.kafka=WARN
